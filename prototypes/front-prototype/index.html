<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>High1 Front Bridge v0.8.41</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      .topbar-right { margin-left: auto; }
      .gnb-acc { position: relative; }
      .gnb-acc-btn { color: rgba(255,255,255,.9); text-decoration: none; font-size: 14px; font-weight: 600; cursor: pointer; display: inline-block; padding: 8px 2px; }
      .gnb-acc-btn:hover { color: #fff; }
      .gnb-acc-menu { display: none; position: absolute; top: 100%; left: 0; min-width: 132px; background: #fff; border: 1px solid #e0e0da; border-radius: 8px; box-shadow: 0 6px 18px rgba(0,0,0,.15); padding: 6px 0; z-index: 60; }
      .gnb-acc:hover .gnb-acc-menu { display: block; }
      .gnb-acc-menu a { display: block; padding: 9px 18px; font-size: 13px; color: #333; text-decoration: none; }
      .gnb-acc-menu a:hover { background: #f5f5f2; color: #7c3aed; }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <a href="#/" class="logo"><img src="logo.png" alt="high1 resort" class="logo-img" /></a>
        <div class="topbar-right">
          <select id="langSelect" class="lang-select" aria-label="Language">
            <option value="en">English</option>
            <option value="zh">中文</option>
            <option value="ko">한국어</option>
          </select>
          <div class="gnb-acc">
            <a class="gnb-acc-btn" href="#/bridge/HOTEL">Accommodation <span style="font-size:9px">▾</span></a>
            <div class="gnb-acc-menu">
              <a href="#/bridge/HOTEL">Hotel</a>
              <a href="#/bridge/CONDO">Condo</a>
            </div>
          </div>
          <div class="gnb-acc" id="ticketNav">
            <a class="gnb-acc-btn" href="#/ticket/search">Ticket <span style="font-size:9px">▾</span></a>
            <div class="gnb-acc-menu" id="ticketNavMenu"></div>
          </div>
          <div class="gnb-acc" id="myNav">
            <a class="gnb-acc-btn" href="javascript:void(0)">Mypage <span style="font-size:9px">▾</span></a>
            <div class="gnb-acc-menu" id="myNavMenu">
              <a href="javascript:void(0)" data-my="profile">Profile</a>
              <a href="javascript:void(0)" data-my="bookings">My Bookings</a>
              <a href="javascript:void(0)" data-my="event">Event</a>
              <a href="javascript:void(0)" data-my="cs">CS Center</a>
              <a href="javascript:void(0)" data-my="logout" id="myLogout">Log out</a>
            </div>
          </div>
          <button type="button" class="signin-btn" id="signinBtn" style="background:#7c3aed;color:#fff;border:none;border-radius:14px;font-size:11px;padding:5px 12px;margin-left:4px;cursor:pointer">Sign in / up</button>
        </div>
      </div>
    </header>

    <main id="app"></main>

    <!-- 숙소 안내/정책/위치 레이어 -->
    <aside id="placeLayer" class="layer hidden" aria-hidden="true">
      <div class="layer-head">
        <h2 id="placeLayerTitle">숙소 정보</h2>
        <button type="button" id="placeLayerClose" class="icon-btn" aria-label="닫기">✕</button>
      </div>
      <div id="placeLayerTabs" class="layer-tabs"></div>
      <div id="placeLayerBody" class="layer-body"></div>
    </aside>
    <div id="placeLayerBackdrop" class="backdrop hidden"></div>

    <!-- 객실·상품 상세 (Room Detail) -->
    <div id="roomDetailModal" class="rd-modal hidden" role="dialog" aria-modal="true" aria-hidden="true">
      <div class="rd-dialog">
        <div class="rd-head">
          <div class="rd-head-text">
            <div id="rdRoomName" class="rd-room-name"></div>
            <div id="rdProductName" class="rd-product-name"></div>
          </div>
          <button type="button" id="rdClose" class="icon-btn" aria-label="닫기">✕</button>
        </div>
        <div class="rd-body">
          <div id="rdGallery" class="rd-gallery"></div>
          <div class="rd-aside">
            <div id="rdDesc" class="rd-desc"></div>
            <h3 class="rd-section-title">Information</h3>
            <ul id="rdInfo" class="rd-info"></ul>
            <div id="rdServices" class="rd-services"></div>
          </div>
        </div>
        <div class="rd-foot">
          <button type="button" class="btn-cta" id="rdSelectRoom">Select Room</button>
        </div>
      </div>
    </div>
    <div id="roomDetailBackdrop" class="backdrop hidden"></div>

    <footer class="site-footer">
      <div class="footer-inner">
        <div class="footer-logo">high<span>1</span></div>
        <div class="footer-info">
          <p>265, High1-gil, Gohan-eup, Jeongseon-gun, Gangwon-do, Korea</p>
          <p>TEL. 1588-7789</p>
          <p class="footer-copy">COPYRIGHT 2020 BY KANGWON LAND INC. ALL RIGHTS RESERVED.</p>
        </div>
      </div>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
