<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>High1 Admin Prototype v0.7.30</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="topbar-l">
          <span class="brand">high1 <span class="ver-badge">v0.7.30</span></span>
          <nav class="gnb" id="gnb"></nav>
        </div>
        <div class="topbar-r">
          <div class="lang-box">
            <span class="lang-label">언어</span>
            <select class="lang-select" id="lang-select">
              <option>한국어</option>
              <option>English</option>
              <option>中文</option>
            </select>
          </div>
          <button type="button" class="logout-btn" id="btn-logout">로그아웃</button>
        </div>
      </header>
      <div class="app-body">
        <aside class="sidebar" id="lnb"></aside>
        <main id="main"></main>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
