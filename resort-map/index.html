.mobile_popup{position: fixed; top: 0; left: 0; z-index: 999; width: 100vw; height: 100vh; padding-top:calc(50% - 100px); box-sizing:border-box; background-color:rgba(0,0,0,0.7); text-align: center;}

/* --- 상단바 --- */
.topbar{max-width:1200px;margin:0 auto 8px;display:flex;align-items:center}
.topbar h1{font-size:20px;color:#1e963c;font-weight:700}
.draft-note{max-width:1200px;margin:8px auto 0;font-size:12px;color:#888}
.map-wrap{position:relative;margin:0 auto}
.map-scaler{position:relative;width:100%;overflow:visible}
.zoom-ctrl{display:none;position:absolute;left:12px;bottom:12px;z-index:45;flex-direction:column;gap:8px}
.zoom-ctrl button{width:42px;height:42px;font-size:22px;line-height:1;color:#fff;background:rgba(24,29,44,.9);border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.4)}
@media (max-width:1240px){ #wrapper{padding:10px} }

/* --- 우측 상단 통합 카드 (언어 + 카테고리) --- */
.map-menu{position:absolute;top:16px;right:16px;z-index:40;width:186px;background:rgba(24,29,44,.92);color:#fff;border-radius:12px;box-shadow:0 8px 26px rgba(0,0,0,.45);padding:10px;font-size:13px}
.map-menu .mm-toggle{display:none;align-items:center;justify-content:center;gap:8px;width:100%;height:38px;font-size:14px;font-weight:700;color:#fff;border-radius:8px;background:rgba(255,255,255,.12)}
.map-menu .mm-toggle .mm-ic{font-size:16px}
.map-menu .mm-header{display:none;align-items:center;justify-content:space-between;margin-bottom:8px}
.map-menu .mm-header .mm-title{font-size:15px;font-weight:700;color:#fff}
.map-menu .mm-close{width:28px;height:28px;font-size:16px;color:#fff;border-radius:6px;background:rgba(255,255,255,.12)}
.map-menu .lang-row{display:flex;gap:4px;margin-bottom:8px}
.map-menu .lang-row button{flex:1;padding:6px 0;border-radius:6px;background:rgba(255,255,255,.10);color:#cbd5e1;font-size:12px}
.map-menu .lang-row button.on{background:#fff;color:#181d2c;font-weight:700}
.map-menu .mm-div{height:1px;background:rgba(255,255,255,.15);margin:2px 0 8px}
.map-menu .cat-list{display:flex;flex-direction:column;gap:2px}
.map-menu .cat-item{display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border-radius:8px;font-size:14px;color:#e5e7eb;text-align:left;line-height:1.2;white-space:nowrap}
.map-menu .cat-item .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto;background:var(--c);box-shadow:0 0 0 2px rgba(255,255,255,.18)}
.map-menu .cat-item:hover{background:rgba(255,255,255,.08)}
.map-menu .cat-item.on{background:rgba(255,255,255,.14);font-weight:700;box-shadow:inset 3px 0 0 var(--c)}

/* --- 핀 --- */
.spot_group button{position:absolute}
.spot_group button.labelpin{padding:5px 12px;border-radius:6px;font-size:14px;font-weight:700;line-height:1.2;white-space:nowrap;background:var(--c);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.45);box-shadow:0 1px 6px rgba(0,0,0,.35)}
.spot_group button.dot-pin{width:18px;height:18px;border-radius:50%;background:var(--c);border:3px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.5)}
.spot_group button.dot-pin .lbl{position:absolute;bottom:130%;left:50%;transform:translateX(-50%);background:#181d2c;color:#fff;padding:4px 8px;border-radius:6px;font-size:12px;font-weight:600;white-space:nowrap;display:none;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.spot_group button.dot-pin:hover .lbl,.spot_group button.dot-pin:focus .lbl{display:block}

/* --- 정보 팝업 --- */
.fullmap.info_active:before{content:"";display:block;position:absolute;inset:0;z-index:10;background:rgba(0,0,0,.45)}
.spot_info{z-index:60}
.spot_info .img_area{height:auto}
.spot_info .img_area img{width:100%;height:auto;display:block}
.spot_info .book-btn{display:block;width:100%;box-sizing:border-box;margin-top:12px;padding:11px 12px;border-radius:9px;background:linear-gradient(180deg,#2f8bed,#2b6fd4);color:#fff;text-align:center;font-size:14px;font-weight:700;text-decoration:none}
.spot_info .book-btn:hover{filter:brightness(1.06)}

/* --- 모바일 --- */
@media (max-width:700px){
  .map-scaler{height:72vh;overflow:auto;-webkit-overflow-scrolling:touch}
  .map-menu{width:auto;padding:6px}
  .map-menu .mm-toggle{display:inline-flex}
  .map-menu .mm-body{display:none}
  .map-menu.open{width:186px}
  .map-menu.open .mm-toggle{display:none}
  .map-menu.open .mm-body{display:block}
  .map-menu.open .mm-header{display:flex}
  .spot_info{position:fixed !important;left:12px !important;right:12px !important;top:50% !important;bottom:auto !important;transform:translateY(-50%);width:auto !important;max-width:330px;margin:0 auto;max-height:86vh;overflow:auto;border-radius:14px}
}

var CAT_COLORS={"hotelncondo":"#3b82f6","waterworld":"#22d3ee","ski":"#a78bfa","golf":"#f59e0b","casino":"#f43f5e","":"#9ca3af"};
var CATS=[{"cat":"","color":"#cbd5e1"},{"cat":"hotelncondo","color":"#3b82f6"},{"cat":"waterworld","color":"#22d3ee"},{"cat":"ski","color":"#a78bfa"},{"cat":"golf","color":"#f59e0b"},{"cat":"casino","color":"#f43f5e"}];
var lang="en", activeCat="";

function t(key){ return (I18N[key]&&(I18N[key][lang]||I18N[key].en))||""; }
function catLabel(cat){ if(!cat) return t("all"); var tb=TABS.filter(function(x){return x.k===cat;})[0]; return tb?(tb[lang]||tb.en):cat; }

function renderMenu(){
  var list=document.querySelector('.cat-list'); list.innerHTML='';
  CATS.forEach(function(c){
    var b=document.createElement('button');
    b.type='button'; b.className='cat-item'+(c.cat===activeCat?' on':'');
    b.style.setProperty('--c',c.color); b.setAttribute('data-cat',c.cat);
    b.innerHTML='<span class="dot"></span><span class="lbl"></span>';
    b.querySelector('.lbl').textContent=catLabel(c.cat);
    b.addEventListener('click',function(){ selectCat(c.cat); });
    list.appendChild(b);
  });
}
function renderPins(){
  var g=document.querySelector('.spot_group'); g.innerHTML='';
  PLACES.forEach(function(p){
    if(activeCat && p.cat!==activeCat) return;
    var labeled = !!activeCat || p.cat==='hotelncondo';
    var b=document.createElement('button');
    b.type='button'; b.setAttribute('data-place',p.id);
    b.style.left=p.pin.l+'px'; b.style.top=p.pin.t+'px';
    var nm=p.name[lang]||p.name.en;
    if(labeled){
      b.className='labelpin'; b.style.setProperty('--c',CAT_COLORS[p.cat]||'#9ca3af');
      b.innerHTML=nm;
    } else {
      b.className='dot-pin'; b.style.setProperty('--c',CAT_COLORS[p.cat]||'#9ca3af');
      b.innerHTML='<span class="lbl">'+nm+'</span>';
    }
    b.addEventListener('click',function(e){ e.stopPropagation(); openInfo(p); });
    g.appendChild(b);
  });
}
function setMapBg(tab){ document.querySelector('.fullmap').style.backgroundImage = tab ? ("url('img/tab_"+tab+".jpg')") : "url('img/fullmap.jpg')"; }
function selectCat(cat){
  activeCat=cat;
  document.querySelectorAll('.cat-item').forEach(function(x){ x.classList.toggle('on', x.getAttribute('data-cat')===cat); });
  setMapBg(cat||null); closeInfo(); renderPins();
}
function openInfo(p){
  var fm=document.querySelector('.fullmap'), si=document.querySelector('.spot_info');
  si.setAttribute('data-place',p.id);
  document.getElementById('si-img').src='img/'+p.id+'.jpg';
  document.getElementById('si-img').alt=p.name[lang]||'';
  document.getElementById('si-title').innerHTML=p.name[lang]||p.name.en;
  document.getElementById('si-road').innerHTML=(p.road[lang]||p.road.en||'');
  document.getElementById('si-tel').innerHTML='TEL : '+p.tel;
  var btn=document.getElementById('si-btn'); var link=LINKS[p.id];
  if(link){ btn.style.display='block'; btn.href=link; btn.textContent=t('book'); }
  else { btn.style.display='none'; }
  si.style.display='block'; fm.classList.add('info_active'); si.focus();
}
function closeInfo(){
  var si=document.querySelector('.spot_info');
  si.style.display='none'; si.removeAttribute('data-place');
  document.querySelector('.fullmap').classList.remove('info_active');
}
function applyLang(){
  document.documentElement.setAttribute('lang',lang);
  document.querySelectorAll('[data-i18n]').forEach(function(e){ var k=e.getAttribute('data-i18n'); if(I18N[k]) e.innerHTML=I18N[k][lang]||I18N[k].en; });
  document.querySelectorAll('.lang-row button').forEach(function(x){ x.classList.toggle('on', x.getAttribute('data-lang')===lang); });
  renderMenu(); renderPins(); closeInfo();
}
// 언어 토글
document.querySelector('.lang-row').addEventListener('click',function(ev){
  var b=ev.target.closest('button[data-lang]'); if(!b) return;
  lang=b.getAttribute('data-lang'); applyLang();
});
// 팝업 닫기: X + 바깥 클릭
document.querySelector('.spot_info .close').addEventListener('click',function(e){ e.stopPropagation(); closeInfo(); });
document.addEventListener('click',function(e){
  if(!document.querySelector('.fullmap').classList.contains('info_active')) return;
  if(e.target.closest('.spot_info')) return;
  if(e.target.closest('.spot_group button')) return;
  if(e.target.closest('.map-menu')) return;
  closeInfo();
});
// 모바일 메뉴 펼침/접기 (Menu ☰ → 열기, 헤더 ✕ → 닫기)
document.querySelector('.mm-toggle').addEventListener('click',function(){ document.querySelector('.map-menu').classList.add('open'); });
var _mmClose=document.querySelector('.mm-close'); if(_mmClose) _mmClose.addEventListener('click',function(){ document.querySelector('.map-menu').classList.remove('open'); });
// 반응형: 데스크톱=폭맞춤 / 모바일=팬(스크롤)+줌(A)
var mzoom=0.85;
function isMobile(){ return window.innerWidth<=700; }
function fit(){
  var inner=document.querySelector('.map-inner'), wrap=document.querySelector('.map-wrap'), zc=document.querySelector('.zoom-ctrl');
  inner.style.transform='none';
  if(isMobile()){
    wrap.style.width='100%'; inner.style.zoom=mzoom; zc.style.display='flex';
  } else {
    var avail=Math.min(document.getElementById('wrapper').clientWidth, window.innerWidth-20);
    var scale=Math.min(1, avail/1210);
    inner.style.zoom=scale; wrap.style.width=(1210*scale)+'px'; zc.style.display='none';
  }
}
function setMZoom(z){ mzoom=Math.max(0.5,Math.min(1.7,z)); document.querySelector('.map-inner').style.zoom=mzoom; }
document.querySelector('.zoom-ctrl').addEventListener('click',function(ev){
  var b=ev.target.closest('button[data-z]'); if(!b) return;
  setMZoom(mzoom*(b.getAttribute('data-z')==='in'?1.25:0.8));
});
(function(){ // 핀치 줌
  var sc=document.querySelector('.map-scaler'); var startD=0, startZ=1;
  function dist(t){ var dx=t[0].clientX-t[1].clientX, dy=t[0].clientY-t[1].clientY; return Math.sqrt(dx*dx+dy*dy); }
  sc.addEventListener('touchstart',function(e){ if(e.touches.length===2){ startD=dist(e.touches); startZ=mzoom; } },{passive:true});
  sc.addEventListener('touchmove',function(e){ if(e.touches.length===2&&startD){ e.preventDefault(); setMZoom(startZ*dist(e.touches)/startD); } },{passive:false});
  sc.addEventListener('touchend',function(e){ if(e.touches.length<2) startD=0; });
})();
window.addEventListener('resize',fit);
applyLang(); fit();
